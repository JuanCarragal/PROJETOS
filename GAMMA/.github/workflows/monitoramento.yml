name: Monitoramento iPhone Paraguai

on:
  push: # Força a execução imediata ao receber este commit
  schedule:
    - cron: "0 5 * * *" # Executa todos os dias às 02:00 (UTC-3)
  workflow_dispatch: # Permite execução manual pelo Github

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Script de Monitoramento
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python pesquisa_iphone_paraguai.py

      - name: Comitar Histórico Atualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historico_iphone_paraguai.csv
          # Adiciona o infográfico caso tenha sido gerado (geralmente às sextas)
          git add infografico_precos_paraguai.html || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualização do histórico de preços" && git push)
