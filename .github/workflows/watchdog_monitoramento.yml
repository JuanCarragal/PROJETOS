name: Watchdog - Alerta de Falha no Monitoramento

on:
  workflow_run:
    workflows: ["Monitoramento de Precos iPhone Paraguai"]
    types: [completed]
  schedule:
    - cron: '45 4 * * *'
      timezone: 'America/Sao_Paulo'

permissions:
  actions: read
  contents: read

jobs:
  verificar-e-alertar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar Watchdog
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_EVENT: ${{ github.event_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_HTML_URL: ${{ github.event.workflow_run.html_url }}
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          cat << 'PYEOF' > /tmp/watchdog.py
          import json
          import os
          import smtplib
          import sys
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from email.header import Header
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          EMAIL_REMETENTE = os.getenv("EMAIL_REMETENTE", "").strip()
          EMAIL_SENHA = os.getenv("EMAIL_SENHA", "").strip()
          EMAIL_DESTINO = os.getenv("EMAIL_DESTINO", "carragal@hotmail.com").strip()
          SMTP_SERVER_ENV = os.getenv("SMTP_SERVER", "").strip()
          SMTP_PORT_ENV = os.getenv("SMTP_PORT", "").strip()
          GH_TOKEN = os.getenv("GH_TOKEN", "")
          TRIGGER_EVENT = os.getenv("TRIGGER_EVENT", "schedule")
          WR_CONCLUSION = os.getenv("WR_CONCLUSION", "")
          WR_HTML_URL = os.getenv("WR_HTML_URL", "https://github.com/JuanCarragal/PROJETOS/actions")
          WR_NAME = os.getenv("WR_NAME", "Monitoramento de Precos iPhone Paraguai")
          WR_CREATED_AT = os.getenv("WR_CREATED_AT", "")

          smtp_server = SMTP_SERVER_ENV or (
              "smtp.gmail.com" if "gmail.com" in EMAIL_REMETENTE.lower() else "smtp-mail.outlook.com"
          )
          smtp_port = int(SMTP_PORT_ENV) if SMTP_PORT_ENV else (
              465 if "gmail.com" in EMAIL_REMETENTE.lower() else 587
          )

          def api_github(path):
              url = f"https://api.github.com/repos/JuanCarragal/PROJETOS/{path}"
              request = urllib.request.Request(url)
              request.add_header("Authorization", f"Bearer {GH_TOKEN}")
              request.add_header("Accept", "application/vnd.github.v3+json")
              request.add_header("User-Agent", "watchdog-py/1.0")
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.loads(response.read())

          def enviar_alerta(assunto, corpo_html):
              if not EMAIL_REMETENTE or not EMAIL_SENHA:
                  print(f"[!] Secrets SMTP ausentes; alerta nao enviado: {assunto}")
                  return False

              mensagem = MIMEMultipart()
              mensagem["From"] = EMAIL_REMETENTE
              mensagem["To"] = EMAIL_DESTINO
              mensagem["Subject"] = Header(assunto, "utf-8")
              mensagem.attach(MIMEText(corpo_html, "html", "utf-8"))

              try:
                  if smtp_port == 465:
                      with smtplib.SMTP_SSL(smtp_server, smtp_port, timeout=20) as servidor:
                          servidor.login(EMAIL_REMETENTE, EMAIL_SENHA)
                          servidor.send_message(mensagem)
                  else:
                      with smtplib.SMTP(smtp_server, smtp_port, timeout=20) as servidor:
                          servidor.ehlo()
                          servidor.starttls()
                          servidor.ehlo()
                          servidor.login(EMAIL_REMETENTE, EMAIL_SENHA)
                          servidor.send_message(mensagem)
                  print(f"[+] Alerta enviado via SMTP: {assunto}")
                  return True
              except Exception as erro:
                  print(f"[X] Falha ao enviar alerta SMTP: {type(erro).__name__}: {erro}")
                  return False

          def html_alerta(titulo, motivo, detalhes, link_actions):
              horario_brasilia = datetime.now(timezone(timedelta(hours=-3))).strftime("%d/%m/%Y %H:%M")
              return f"""<html><head><meta charset=\"utf-8\"><style>
                body{{font-family:Arial,sans-serif;background:#f4f7f9;margin:0;padding:20px}}
                .card{{background:#fff;max-width:600px;margin:0 auto;padding:28px;border-radius:12px}}
                .hdr{{background:#b91c1c;color:#fff;padding:16px 20px;border-radius:8px;margin-bottom:20px}}
                .details{{background:#f8fafc;border-left:3px solid #dc2626;padding:14px 16px;margin:16px 0;color:#334155;line-height:1.7}}
                .btn{{display:inline-block;margin-top:16px;padding:11px 22px;background:#0284c7;color:#fff;text-decoration:none;border-radius:8px;font-weight:700}}
                .footer{{margin-top:24px;font-size:11px;color:#64748b;text-align:center}}
              </style></head><body><div class=\"card\">
                <div class=\"hdr\"><h2>[ALERTA] {titulo}</h2></div>
                <p><strong>Detectado em:</strong> {horario_brasilia} (horario de Brasilia)</p>
                <div class=\"details\"><strong>Motivo:</strong> {motivo}<br><br>{detalhes}</div>
                <a class=\"btn\" href=\"{link_actions}\">Abrir GitHub Actions</a>
                <p class=\"footer\">Watchdog do monitoramento iPhone Paraguai</p>
              </div></body></html>"""

          agora_utc = datetime.now(timezone.utc)
          deve_alertar = False
          titulo = motivo = detalhes = ""
          link_actions = WR_HTML_URL

          if TRIGGER_EVENT == "workflow_run":
              print(f"[*] Evento workflow_run; conclusao={WR_CONCLUSION}")
              if WR_CONCLUSION == "success":
                  print("[OK] Workflow principal concluido com sucesso.")
              elif WR_CONCLUSION in ("failure", "cancelled", "timed_out", "startup_failure"):
                  deve_alertar = True
                  titulo = f"Falha no monitoramento ({WR_CONCLUSION})"
                  motivo = f"O workflow principal terminou com status {WR_CONCLUSION}."
                  hora_run = WR_CREATED_AT[:16].replace("T", " ") + " UTC" if WR_CREATED_AT else "desconhecida"
                  detalhes = (
                      f"<strong>Workflow:</strong> {WR_NAME}<br>"
                      f"<strong>Horario do run:</strong> {hora_run}<br>"
                      "<strong>Acao:</strong> abra o run no GitHub Actions e consulte o log."
                  )
              else:
                  print(f"[?] Conclusao nao mapeada: {WR_CONCLUSION}")
          else:
              print("[*] Verificacao agendada da execucao diaria...")
              try:
                  resposta = api_github("actions/workflows/monitoramento_iphone.yml/runs?per_page=20")
                  runs = resposta.get("workflow_runs", [])
                  brasilia = timezone(timedelta(hours=-3))
                  hoje_brasilia = agora_utc.astimezone(brasilia).date()
                  runs_hoje = [
                      run for run in runs
                      if datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
                      .astimezone(brasilia).date() == hoje_brasilia
                  ]
                  agendados_hoje = [run for run in runs_hoje if run.get("event") == "schedule"]
                  agendados_ok = [run for run in agendados_hoje if run.get("conclusion") == "success"]

                  if not agendados_hoje:
                      deve_alertar = True
                      agendados_anteriores = [run for run in runs if run.get("event") == "schedule"]
                      ultimo = (
                          agendados_anteriores[0]["created_at"][:16].replace("T", " ") + " UTC"
                          if agendados_anteriores else "nenhum registrado"
                      )
                      houve_manual_ok = any(run.get("conclusion") == "success" for run in runs_hoje)
                      titulo = "Agendamento nao executou hoje"
                      motivo = "Nenhum run com evento schedule foi encontrado para hoje."
                      detalhes = (
                          f"<strong>Ultimo run agendado:</strong> {ultimo}<br>"
                          f"<strong>Run manual bem-sucedido hoje:</strong> {'sim' if houve_manual_ok else 'nao'}<br>"
                          "<strong>Acao:</strong> verifique o cron e a pagina Actions."
                      )
                      link_actions = "https://github.com/JuanCarragal/PROJETOS/actions"
                  elif not agendados_ok:
                      ultimo = agendados_hoje[0]
                      deve_alertar = True
                      conclusao = ultimo.get("conclusion") or ultimo.get("status") or "desconhecido"
                      hora_run = ultimo["created_at"][:16].replace("T", " ") + " UTC"
                      titulo = "Execucao agendada falhou hoje"
                      motivo = f"O ultimo run schedule terminou com status {conclusao}."
                      detalhes = (
                          f"<strong>Horario:</strong> {hora_run}<br>"
                          f"<strong>Status:</strong> {conclusao}<br>"
                          f"<strong>Runs agendados hoje:</strong> {len(agendados_hoje)}<br>"
                          "<strong>Acao:</strong> consulte o log do run no GitHub Actions."
                      )
                      link_actions = ultimo.get("html_url", link_actions)
                  else:
                      print(f"[OK] {len(agendados_ok)} run(s) agendado(s) concluido(s) hoje.")
              except Exception as erro:
                  deve_alertar = True
                  titulo = "Falha ao verificar o agendamento"
                  motivo = f"O watchdog nao conseguiu consultar a API do GitHub: {type(erro).__name__}: {erro}"
                  detalhes = "Confira as permissoes do GITHUB_TOKEN e a disponibilidade da API."
                  link_actions = "https://github.com/JuanCarragal/PROJETOS/actions"
                  print(f"[X] Erro consultando a API do GitHub: {type(erro).__name__}: {erro}")

          if deve_alertar:
              corpo = html_alerta(titulo, motivo, detalhes, link_actions)
              if not enviar_alerta(f"[WATCHDOG] {titulo}", corpo):
                  sys.exit(1)
          PYEOF
          python /tmp/watchdog.py
