name: Monitoramento de Precos iPhone Paraguai

on:
  schedule:
    # Executa toda sexta-feira às 12:00 UTC (09:00 Horário de Brasília)
    - cron: '0 12 * * 5'
  workflow_dispatch:
    inputs:
      forcar_sexta:
        description: 'Forçar geração do infográfico'
        required: false
        default: true
        type: boolean

jobs:
  executar-monitoramento:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4 pandas python-dotenv

      - name: Executar Monitoramento e Gerador de Infográfico
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          python GAMMA/pesquisa_iphone_paraguai.py --forcar-sexta

      - name: Upload dos Relatórios como Artefatos (CSV + Infográfico HTML)
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-precos-paraguai
          path: |
            GAMMA/historico_iphone_paraguai.csv
            GAMMA/infografico_precos_paraguai.html
            historico_iphone_paraguai.csv

      - name: Commit e Push das Atualizações de Histórico
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add GAMMA/historico_iphone_paraguai.csv GAMMA/infografico_precos_paraguai.html || true
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos dados para commitar."
          else
            git commit -m "chore(data): atualização automática do histórico e infográfico semanal [skip ci]"
            git push
          fi
