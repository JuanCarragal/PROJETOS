name: Monitoramento de Precos iPhone Paraguai

on:
  schedule:
    # Executa todos os dias as 11:15 UTC (08:15 Horario de Brasilia)
    - cron: '15 11 * * *'
    # Segunda tentativa diaria, caso a primeira execucao agendada seja perdida ou atrasada.
    - cron: '45 11 * * *'
  workflow_dispatch:
    inputs:
      forcar_sexta:
        description: 'Forcar geracao do infografico semanal'
        required: false
        default: false
        type: boolean
      teste_email:
        description: 'Enviar somente um e-mail de teste usando os secrets do repositorio'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: monitoramento-iphone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  executar-monitoramento:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet

      - name: Executar Monitoramento com Retry
        id: execucao
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          IPHONE_OUTPUT_DIR: ${{ github.workspace }}/GAMMA
          EVENT_NAME: ${{ github.event_name }}
        run: |
          MAX_TENTATIVAS=3
          FORCAR_SEXTA="${{ github.event.inputs.forcar_sexta }}"
          TESTE_EMAIL="${{ github.event.inputs.teste_email }}"
          RUN_DATE="$(TZ=America/Sao_Paulo date +%F)"

          if [ "$TESTE_EMAIL" = "true" ]; then
            set +e
            python GAMMA/pesquisa_iphone_paraguai.py --teste-email 2>&1 | tee -a GAMMA/execucao_log.txt
            EXIT_CODE=${PIPESTATUS[0]}
            set -e
            exit "$EXIT_CODE"
          fi

          if [ "$EVENT_NAME" = "schedule" ] && [ -f GAMMA/.last_successful_run ] && [ "$(cat GAMMA/.last_successful_run)" = "$RUN_DATE" ]; then
            echo "Ja existe uma execucao diaria concluida em $RUN_DATE; ignorando esta tentativa agendada para evitar duplicidade."
            exit 0
          fi

          for tentativa in $(seq 1 $MAX_TENTATIVAS); do
            echo "========================================="
            echo ">>> Tentativa $tentativa de $MAX_TENTATIVAS"
            echo "========================================="

            set +e
            if [ "$FORCAR_SEXTA" = "true" ]; then
              python GAMMA/pesquisa_iphone_paraguai.py --forcar-sexta 2>&1 | tee -a GAMMA/execucao_log.txt
            else
              python GAMMA/pesquisa_iphone_paraguai.py 2>&1 | tee -a GAMMA/execucao_log.txt
            fi
            EXIT_CODE=${PIPESTATUS[0]}
            set -e

            if [ $EXIT_CODE -eq 0 ]; then
              echo ">>> Execucao concluida com sucesso na tentativa $tentativa."
              break
            fi

            if [ $tentativa -lt $MAX_TENTATIVAS ]; then
              echo ">>> Tentativa $tentativa falhou (codigo $EXIT_CODE). Aguardando 90s..."
              sleep 90
            else
              echo ">>> Todas as $MAX_TENTATIVAS tentativas falharam."
              exit 1
            fi
          done

          printf '%s\n' "$RUN_DATE" > GAMMA/.last_successful_run

      - name: Upload dos Relatorios como Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-precos-paraguai
          path: |
            GAMMA/historico_iphone_paraguai.csv
            GAMMA/relatorio_iphone_paraguai_*.xlsx
            GAMMA/infografico_precos_paraguai.html
            GAMMA/infografico_precos_paraguai_*.html
            GAMMA/execucao_log.txt
          if-no-files-found: ignore

      - name: Commit e Push do Historico
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f GAMMA/historico_iphone_paraguai.csv || true
          git add GAMMA/.last_successful_run || true
          git add GAMMA/infografico_precos_paraguai.html || true
          if git diff --staged --quiet; then
            echo "Nenhuma alteracao nos dados para commitar."
          else
            git commit -m "chore(data): atualizacao automatica do historico e infografico [skip ci]"
            git push origin main
          fi
