name: Pesquisa diária de preços do iPhone

on:
  schedule:
    # 09:00 no horário de Brasília (UTC-3).
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pesquisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Pesquisar preços e enviar relatório
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python "Pesquisa Iphone 17 Pro Max Paraguai.py"
