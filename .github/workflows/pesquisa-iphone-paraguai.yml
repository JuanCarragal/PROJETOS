name: Pesquisa diária de preços do iPhone

on:
  schedule:
    # Inicia com 4 horas de margem; o passo abaixo espera 09:00 em Brasília.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pesquisar:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Aguardar 09:00 no horário de Brasília
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          from datetime import datetime
          from time import sleep
          from zoneinfo import ZoneInfo

          timezone = ZoneInfo("America/Sao_Paulo")
          now = datetime.now(timezone)
          target = now.replace(hour=9, minute=0, second=0, microsecond=0)
          if now >= target:
              print(f"Agendamento iniciado após 09:00 ({now:%H:%M:%S}); seguindo sem espera.")
          else:
              delay = (target - now).total_seconds()
              print(f"Aguardando até 09:00 em Brasília ({delay:.0f} segundos).")
              sleep(delay)
          PY

      - name: Pesquisar preços e enviar relatório
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python "Pesquisa Iphone 17 Pro Max Paraguai.py"

      - name: Salvar histórico no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico_precos_iphone.csv
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no histórico para publicar."
          else
            git commit -m "Atualizar histórico diário de preços"
            git push
          fi
